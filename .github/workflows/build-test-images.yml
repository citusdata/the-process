name: build-test-images

on:
  push:
    branches:
      - "**"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'master' && !startsWith(github.ref_name, 'release-') }}

jobs:
  prepare_pgversion_matrix:
    runs-on: ubuntu-24.04
    steps:
      # Need the repo checked out in order to read versions.json
      - uses: actions/checkout@v6
      - id: get_versions
        shell: bash
        run: |
          pgversions=$(jq -ec '.postgres_ci | to_entries | sort_by(.key | tonumber) | map(.value)' versions.json)
          line=$(jq -er '.line' versions.json)
          echo "pgversions=${pgversions}" >> "$GITHUB_OUTPUT"
          echo "line=${line}" >> "$GITHUB_OUTPUT"
    outputs:
      # Will look like '["15.20","16.16","17.12"]'
      pgversions: ${{ steps.get_versions.outputs.pgversions }}
      line: ${{ steps.get_versions.outputs.line }}

  build_images_per_postgres:
    name: push-test-images-per-postgres
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    needs:
      - prepare_pgversion_matrix
    env:
      RELEASE_FLAG: ${{ (github.ref_name == 'master' || startsWith(github.ref_name, 'release-')) && '1' || '' }}
    strategy:
      fail-fast: false
      matrix:
        command: [extbuilder, exttester, failtester]
        pgversion: ${{ fromJSON(needs.prepare_pgversion_matrix.outputs.pgversions) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and publish release/dev image based on RELEASE_FLAG
      - name: Build & Push images
        run: |
          cd circleci/images
          if [ -n "${RELEASE_FLAG}" ]; then
            RELEASE=${RELEASE_FLAG} make push-${{ matrix.command }}-${{ matrix.pgversion }}
          else
            make push-${{ matrix.command }}-${{ matrix.pgversion }}
          fi

  build_images_shared:
    name: push-test-images-shared
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    env:
      RELEASE_FLAG: ${{ (github.ref_name == 'master' || startsWith(github.ref_name, 'release-')) && '1' || '' }}
    strategy:
      fail-fast: false
      matrix:
        command: [citusupgradetester, pgupgradetester, stylechecker]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and publish release/dev image based on RELEASE_FLAG
      - name: Build & Push images
        run: |
          cd circleci/images
          if [ -n "${RELEASE_FLAG}" ]; then
            RELEASE=${RELEASE_FLAG} make push-${{ matrix.command }}-all
          else
            make push-${{ matrix.command }}-all
          fi

  notify_citus:
    needs:
      - prepare_pgversion_matrix
      - build_images_per_postgres
      - build_images_shared
    if: github.repository == 'citusdata/the-process' && (github.ref_name == 'master' || startsWith(github.ref_name, 'release-')) && needs.prepare_pgversion_matrix.outputs.line == github.ref_name
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_KEY }}
          owner: citusdata
          repositories: citus

      - name: Dispatch citus-ci-images-ready to citus
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          line=$(jq -er '.line' versions.json)
          if [ "$line" != "$REF_NAME" ]; then
            echo "Skipping dispatch: versions.json line ($line) != ref ($REF_NAME)"
            exit 0
          fi
          tag_suffix=$(RELEASE=1 make -C circleci/images -s print-tag-suffix)
          if ! [[ "$tag_suffix" =~ ^-v[0-9a-f]{7,}$ ]]; then
            echo "::error::Invalid tag_suffix from print-tag-suffix: '${tag_suffix}'"
            exit 1
          fi
          jq -n \
            --arg event_type "citus-ci-images-ready" \
            --arg line "$line" \
            --arg sha "$SHA" \
            --arg tag_suffix "$tag_suffix" \
            '{event_type: $event_type, client_payload: {line: $line, sha: $sha, tag_suffix: $tag_suffix}}' \
            | gh api --method POST repos/citusdata/citus/dispatches --input -
